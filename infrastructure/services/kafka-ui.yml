services:
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: admin-delta-kafka-ui
    restart: unless-stopped

    ports:
      - "${KAFKA_UI_PORT:-8099}:8080"

    environment:
      DYNAMIC_CONFIG_ENABLED: "false"
      KAFKA_CLUSTERS_0_NAME: admin-delta-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    depends_on:
      - kafka

    networks:
      - admin-delta-network

networks:
  admin-delta-network:
    name: admin-delta-network
    driver: bridge