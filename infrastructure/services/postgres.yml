services:
  postgres:
    image: postgres:17
    container_name: admin-delta-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docker/postgres/init/create-databases.sh:/docker-entrypoint-initdb.d/create-databases.sh:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - admin-delta-network

volumes:
  postgres_data:
    name: admin-delta-postgres-data

networks:
  admin-delta-network:
    name: admin-delta-network
    driver: bridge