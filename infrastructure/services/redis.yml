services:
  redis:
    image: redis:7-alpine
    container_name: admin-delta-redis
    restart: unless-stopped

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 5

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

    networks:
      - admin-delta-network

volumes:
  redis_data:
    name: admin-delta-redis-data

networks:
  admin-delta-network:
    name: admin-delta-network
    driver: bridge