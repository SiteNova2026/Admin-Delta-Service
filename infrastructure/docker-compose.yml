
services:
  # =====================================
  # POSTGRESQL
  # =====================================
  postgres:
    image: postgres:17
    container_name: admin-delta-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init/create-databases.sh:/docker-entrypoint-initdb.d/create-databases.sh:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - admin-delta-network
  
  
  # =====================================
  # IDENTITY ACCESS SERVICE
  # =====================================
  identity-access-service:
    build:
      context: ../backend/identity-access-service
      dockerfile: Dockerfile

    container_name: admin-delta-identity
    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/identity_access_db
      DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - admin-delta-network


  # =====================================
  # REACT FRONTEND
  # =====================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile

    container_name: admin-delta-frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules

    networks:
      - admin-delta-network

  # =====================================
  # REDIS
  # =====================================
  redis:
    image: redis:7-alpine
    container_name: admin-delta-redis
    restart: unless-stopped

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 5

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

    networks:
      - admin-delta-network
  

  # =====================================
  # KAFKA - KRAFT MODE
  # =====================================
  kafka:
    image: apache/kafka:4.1.1
    container_name: admin-delta-kafka
    restart: unless-stopped

    ports:
      - "${KAFKA_PORT:-9094}:9094"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - admin-delta-network


  # =====================================
  # KAFKA UI
  # =====================================
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: admin-delta-kafka-ui
    restart: unless-stopped

    ports:
      - "${KAFKA_UI_PORT:-8099}:8080"

    environment:
      DYNAMIC_CONFIG_ENABLED: "false"
      KAFKA_CLUSTERS_0_NAME: admin-delta-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    depends_on:
      - kafka

    networks:
      - admin-delta-network


volumes:
  postgres_data:
    name: admin-delta-postgres-data

  redis_data:
    name: admin-delta-redis-data

  kafka_data:
    name: admin-delta-kafka-data

  frontend_node_modules:
    name: admin-delta-frontend-node-modules

# =====================================
# NETWORK
# =====================================
networks:
  admin-delta-network:
    name: admin-delta-network
    driver: bridge
