services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: admin-delta-frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules

    networks:
      - admin-delta-network

volumes:
  frontend_node_modules:
    name: admin-delta-frontend-node-modules

networks:
  admin-delta-network:
    name: admin-delta-network
    driver: bridge