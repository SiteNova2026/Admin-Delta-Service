name: admin-delta-portal
services:
  frontend-dev:
    profiles:
      - development
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: admin-delta-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - admin-delta-network

  frontend-prod:
    profiles:
      - production
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: admin-delta-frontend-pro
    restart: unless-stopped
    ports:
      - "80:80"

volumes:
  frontend_node_modules:
    name: admin-delta-frontend-node-modules

networks:
  admin-delta-network:
    name: admin-delta-network
    driver: bridge
