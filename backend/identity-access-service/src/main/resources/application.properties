# Application
spring.application.name=identity-access-service
server.port=8081

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/identity_access_db}
spring.datasource.username=${DB_USERNAME:admin_delta}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false